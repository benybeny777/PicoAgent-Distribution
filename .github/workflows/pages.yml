name: 公開サイトを配信

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 公開内容を取得
        uses: actions/checkout@v6
      - name: Pagesを設定
        uses: actions/configure-pages@v6
      - name: 静的ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Pagesへ配信
        id: deployment
        uses: actions/deploy-pages@v5
